name: CI

# The checks this plugin runs on every pull request and on pushes to main.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the `checks` job, so
# one definition serves every UAMS-Web repository and this plugin carries no copy that drifts. The call
# switches on the two jobs only a plugin runs (`floor-lint`, `download-archive`), runs on Linux only, and
# runs the unit suite as `composer test:unit`. Mutation testing is off (`mutate: false`) until it is turned
# on in a ticket of its own; `mutate-ignore: true` still audits the `@pest-mutate-ignore` annotations.
# `phpcs` stays off: this plugin has no PHPCS configuration. The chain's own header lists every input.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two pull-request-body
# checks, `Attribution footer` and `Closing keywords`). It `needs:` the call, runs `if: always()`, and fails
# unless the call reports `success`: a `skipped` or `cancelled` call fails it. Adding a plain job here means
# adding it to the `needs:` list of `CI`. Do not rename `CI`, and do not rename `checks` without changing
# `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, the Composer scripts `test:pint`,
# `test:refactor`, `stan` and `test:unit`, and `scripts/lint-floor.php`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a group of its
# own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Pinned to a release tag, never a branch or a commit, so a change to the chain reaches this plugin
    # only when the pin moves.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.12.0
    with:
      linux-only: true
      mutate: true
      mutate-paths: includes
      mutate-ignore: true
      mutate-ignore-paths: includes
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call.
  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
